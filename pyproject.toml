[project]
name = "hl7-imaging-bridge"
version = "0.1.0"
description = "HL7 v2 + DICOM + FHIR tooling: MLLP ingest, order-to-image reconciliation, report ACK tracking, and a v2-to-FHIR bridge. Synthetic data only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hl7>=0.4.5",
    "fhir-resources>=8.3.0",
    "pydicom>=3.0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
hl7bridge = "hl7bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hl7bridge"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.14",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Curated, high-precision set. DTZ enforces timezone-aware datetimes (engineering
# rule 4), BLE bans blind excepts (rule 1). On a false positive: narrow with a
# justified per-line noqa, never drop the rule.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "DTZ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may construct fixed naive inputs on purpose to prove they are rejected.
"tests/**" = ["DTZ001"]

# Strict typing on the library; tests are exercised by pytest itself and
# checked by ruff, where strict mypy on pydantic-model assertions is noise.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "hl7.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fhir: system tests that need a running HAPI FHIR server (HL7B_FHIR_BASE)",
]
