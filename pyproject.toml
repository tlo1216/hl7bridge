[project]
name = "hl7bridge"
dynamic = ["version"]
description = "HL7 v2, DICOM and FHIR integration toolkit: MLLP listener with explicit ACKs, order-to-image reconciliation, report ACK tracking, TAT reporting, message linting and a v2-to-FHIR bridge. Synthetic data only."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tom O'Sullivan" }]
keywords = ["hl7", "hl7v2", "fhir", "mllp", "dicom", "radiology", "interoperability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "hl7>=0.4.5",
    "fhir-resources>=8.3.0",
    "pydicom>=3.0.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
    # Windows has no system time zone database; zoneinfo needs this there.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/tlo1216/hl7bridge"
Source = "https://github.com/tlo1216/hl7bridge"
Issues = "https://github.com/tlo1216/hl7bridge/issues"
Changelog = "https://github.com/tlo1216/hl7bridge/blob/main/CHANGELOG.md"

[project.scripts]
hl7bridge = "hl7bridge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hl7bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hl7bridge"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.14",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Curated, high-precision set. DTZ enforces timezone-aware datetimes, BLE
# bans blind excepts (fail loudly). On a false positive: narrow with a
# justified per-line noqa, never drop the rule.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "DTZ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may construct fixed naive inputs on purpose to prove they are rejected.
"tests/**" = ["DTZ001"]

# Strict typing on the library; tests are exercised by pytest itself and
# checked by ruff, where strict mypy on pydantic-model assertions is noise.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = "hl7.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fhir: system tests that need a running HAPI FHIR server (HL7BRIDGE_FHIR_BASE)",
]
