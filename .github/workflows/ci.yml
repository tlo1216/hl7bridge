name: CI

# Pushes to main, and pull requests. A branch with an open pull request
# runs once (for the pull request), not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One uv version everywhere. Change it here and in the Dockerfile together.
  UV_VERSION: "0.13.9"

# Actions are pinned by commit SHA; the comment names the release.
jobs:
  checks:
    name: format, lint, types, references, licenses, ports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The reference check reads every commit message.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy (strict on src and tools)
        run: uv run mypy
      - name: Reference check (tree and commit messages)
        run: |
          uv run python tools/check_references.py
          uv run python tools/check_references.py --commits
      - name: Runtime dependency licenses
        run: uv run python tools/check_licenses.py
      - name: Published ports are bound to 127.0.0.1
        run: uv run python tools/check_ports.py

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times as much on a private repo, so macOS
        # runs on main and on manual runs only. Make this unconditional once
        # the repository is public.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Unit and system tests (no FHIR server)
        env:
          # The demo guard tests fail instead of skipping when no bash is found.
          HL7BRIDGE_REQUIRE_BASH: "1"
        run: uv run pytest -m "not fhir" -q

  pip-path:
    name: pip install from wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel with pinned tools, install it in a clean venv, smoke test
        shell: bash
        run: |
          set -euo pipefail
          # pip, build and hatchling come from a hashed lock file.
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --wheel --no-isolation --outdir dist
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/venv/Scripts"; else BIN="$RUNNER_TEMP/venv/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/hl7bridge" --version
          # Run outside the checkout, so only what is inside the wheel is used.
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work" && cd "$work"
          "$BIN/hl7bridge" init
          "$BIN/hl7bridge" profile check
          "$BIN/hl7bridge" doctor
          "$BIN/hl7bridge" demo
          "$BIN/hl7bridge" synth --out synth
          # The corpus holds seeded defects, so lint exits 1 by design. The
          # expected file count is read from the corpus, not hard-coded.
          status=0
          "$BIN/hl7bridge" lint synth/messages --json > lint.json || status=$?
          test "$status" -eq 1
          "$BIN/python" - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("lint.json").read_text())
          files = len(list(pathlib.Path("synth/messages").rglob("*.hl7")))
          assert report["files_checked"] == files > 0, (report["files_checked"], files)
          assert report["error_count"] > 0
          print(f"linted {files} files, {report['error_count']} errors (seeded)")
          PY

  readme:
    name: README quickstart runs as written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: README commands and CLI reference
        run: uv run pytest tests/system/test_readme.py -q

  docker:
    name: image builds, runs as non-root, compose demo exits 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (not pushed)
        run: docker build -t hl7bridge:local .
      - name: Runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id hl7bridge:local -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      - name: CLI works in the image
        run: |
          docker run --rm hl7bridge:local --version
          docker run --rm hl7bridge:local demo
      - name: Compose demo against HAPI
        run: docker compose -f compose.demo.yaml up --build --exit-code-from demo --abort-on-container-exit
      - name: Compose logs and clean up
        if: always()
        run: |
          docker compose -f compose.demo.yaml logs --no-color | tail -n 200
          docker compose -f compose.demo.yaml down -v

  fhir-system:
    name: FHIR system tests against HAPI
    runs-on: ubuntu-latest
    services:
      hapi:
        # hapiproject/hapi:v8.12.0-2, pinned by digest.
        image: hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Wait for HAPI to answer /metadata
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/fhir/metadata >/dev/null 2>&1; then
              echo "HAPI ready after ~$((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "HAPI never became ready" >&2
          exit 1
      # HL7BRIDGE_FHIR_REQUIRED=1 turns a missing/unreachable server into a FAILURE,
      # so this job can never silently skip the tests it exists to run.
      - name: FHIR system tests
        env:
          HL7BRIDGE_FHIR_BASE: http://localhost:8080/fhir
          HL7BRIDGE_FHIR_REQUIRED: "1"
        run: uv run pytest tests/system/test_fhir_hapi.py -m fhir -q
      - name: hl7bridge demo against HAPI
        run: uv run hl7bridge demo --fhir-base http://localhost:8080/fhir
