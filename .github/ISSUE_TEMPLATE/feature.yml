name: Feature request
description: Suggest a new tool, rule, mapping or option.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you are solving. Use synthetic examples only.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Commands, options or output are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
